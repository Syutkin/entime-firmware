name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  firmware:
    name: Host tests (UBSan) and ESP32-S3 firmware
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Cache PlatformIO dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio/.cache
            ~/.platformio/platforms
            ~/.platformio/packages
            .pio/libdeps
          key: ${{ runner.os }}-pio-${{ hashFiles('platformio.ini', 'scripts/post_compiledb.py') }}
          restore-keys: |
            ${{ runner.os }}-pio-

      - name: Install PlatformIO
        run: python3 -m pip install --upgrade platformio

      - name: Update PlatformIO dependencies
        id: dependencies
        run: pio pkg update --environment rymcu-esp32-s3-devkitc-1 --no-save

      - name: Run host tests
        env:
          CXX: g++
        run: python3 test/run_host_tests.py --environment rymcu-esp32-s3-devkitc-1 --sanitize --strict

      - name: Build firmware
        # Known test failures must not hide compiler errors in the firmware.
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: pio run --environment rymcu-esp32-s3-devkitc-1
